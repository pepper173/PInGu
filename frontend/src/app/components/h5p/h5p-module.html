<div class="module-wrapper">
  <div class="module-card">

    <div class="card-header">
      <div class="header-left">
        <button class="btn btn-ghost" type="button" (click)="onBack()">
          {{ backButtonLabel }}
        </button>
      </div>

      <div class="header-center">
        <div class="header-title">{{ moduleTitle || 'Lernmodul' }}</div>
      </div>

      <div class="header-right">
        <button class="btn btn-ghost danger" type="button" (click)="onLogout()">
          Ausloggen
        </button>
      </div>
    </div>

    <div class="card-body">
      @if (showIntroOverlay && isLoading) {
        <div class="loading-overlay" aria-live="polite" aria-busy="true">
          <div class="loading-card">
            <div class="loading-title">{{ moduleTitle || 'Lernmodul' }}</div>
            <div class="text">{{ loadingText }}</div>
          </div>
        </div>
      }

      <div #h5pContainer class="h5p-host"></div>
    </div>

    @if (showNavigationButtons) {
      <div class="navigation-buttons">
        <button class="btn btn-ghost" type="button" (click)="onBackToPrevious()" [style.visibility]="showBackButton ? 'visible' : 'hidden'">
          ← Zum vorherigen Kapitel
        </button>
        <button class="btn btn-primary" type="button" (click)="onNext()" [style.visibility]="showNextButton ? 'visible' : 'hidden'">
          Zum nächsten Kapitel →
        </button>
      </div>
    }
  </div>
</div>
