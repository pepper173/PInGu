<div class="page">
  <div class="module-card">

    <div class="card-header">
      <div class="header-left">
        <button class="btn btn-ghost" type="button" (click)="onBack()">
          ← Zurück zu Lernpfaden
        </button>
      </div>

      <div class="header-center">
        <div class="header-title">Digitale Zeitreise - Teil 3</div>
      </div>

      <div class="header-right">
        <button class="btn btn-ghost danger" type="button" (click)="onLogout()">
          Ausloggen
        </button>
      </div>
    </div>

    <div class="card-body">
      @if (isLoading) {
        <div class="loading-overlay" aria-live="polite" aria-busy="true">
          <div class="loading-card">
            <div class="spinner" aria-hidden="true"></div>
            <div class="text">{{ loadingText }}</div>
          </div>
        </div>
      }

      <div #h5pContainer class="h5p-host"></div>
    </div>

    <div class="card-footer">
      <button class="btn btn-ghost" type="button" (click)="onBack()">
        ← Zurück
      </button>
      <button class="btn btn-primary" type="button" (click)="onFinish()">
        Abschließen
      </button>
    </div>
  </div>
</div>
