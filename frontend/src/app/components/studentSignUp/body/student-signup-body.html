<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="student-signup-form"
>
  <div class="form-field">
    <label for="classCode">Klassen-Code</label>
    <input
      id="classCode"
      type="text"
      formControlName="classCode"
      placeholder="z.B. 7A-2024"
    />
    <div class="error" *ngIf="form.get('classCode')?.invalid && form.get('classCode')?.touched">
      Bitte gib einen Klassen-Code ein.
    </div>
  </div>

  <div class="form-field">
    <label for="studentCode">Schüler-Code</label>
    <input
      id="studentCode"
      type="text"
      formControlName="studentCode"
      placeholder="Dein persönlicher Code"
    />
    <div class="error" *ngIf="form.get('studentCode')?.invalid && form.get('studentCode')?.touched">
      Bitte gib deinen Schüler-Code ein.
    </div>
  </div>

  <button type="submit" class="submit-button">
    Senden
  </button>
</form>
