<app-classes-header (logout)="onLogout()"></app-classes-header>

<app-classes-body [classes]="classes" [isLoading]="isLoading" [errorMessage]="errorMessage" (addClass)="onAddClass()"></app-classes-body>

@if (isClassPopupVisible) {
<app-class-popup
    title="Klasse hinzufügen"
    (close)="hideClassPopup()"
    (create)="onCreate($event)"
></app-class-popup>
}
